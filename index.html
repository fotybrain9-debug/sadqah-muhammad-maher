<!DOCTYPE html>
<html lang="en">
<head>
<style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>صدقة جارية - المرحوم محمد ماهر</title>
  <style>
    /* Tailwind CSS Compiled Styles */
    *,:after,:before{box-sizing:border-box;border:0 solid #e5e7eb}
    body{margin:0;font-family:'Cairo', sans-serif;background-color:#051610;color:#f3e5ab;min-height:100vh}
    .glass-card{background:linear-gradient(135deg, rgba(15,56,44,0.75), rgba(10,38,29,0.92));backdrop-filter:blur(14px);border:1px solid rgba(212,175,55,0.18);box-shadow:0 10px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(212,175,55,0.08);}
    .glass-card-gold{background:linear-gradient(135deg, rgba(212,175,55,0.18), rgba(15,56,44,0.88));backdrop-filter:blur(14px);border:1px solid rgba(212,175,55,0.45);box-shadow:0 15px 50px rgba(0,0,0,0.6);}
    .font-quran{font-family:'Amiri', serif;}
  </style>
  <!-- Tailwind CDN للضمان -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body dir="rtl" class="min-h-screen w-full bg-[#051610] text-[#f3e5ab] selection:bg-[#d4af37] selection:text-[#051610] overflow-x-clip">
  <div id="root"></div>

  <!-- تحميل React و ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // بيانات الأذكار
    const on = {
      dead: [
        {text:"اللَّهُمَّ اغْفِرْ لـ محمد ماهر وَارْحَمْهُ، وَعَافِهِ وَاعْفُ عَنْهُ، وَأَكْرِمْ نُزُلَهُ، وَوَسِّعْ مُدْخَلَهُ، وَاغْسِلْهُ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ", count:3},
        {text:"اللَّهُمَّ اجْعَلْ قَبْرَ محمد ماهر رَوْضَةً مِنْ رِيَاضِ الجَنَّةِ، وَلَا تَجْعَلْهُ حُفْرَةً مِنْ حُفَرِ النَّارِ", count:3},
        {text:"اللَّهُمَّ إنَّ محمد ماهر فِي ذِمَّتِكَ وَحَبْلِ جِوَارِكَ، فَقِهِ فِتْنَةَ القَبْرِ وَعَذَابَ النَّارِ", count:3},
        {text:"اللَّهُمَّ أبْدِلْ محمد ماهر دَارًا خَيْرًا مِنْ دَارِهِ، وَأَهْلًا خَيْرًا مِنْ أَهْلِهِ، وَأَدْخِلْهُ الجَنَّةَ", count:1}
      ],
      sabah: [
        {text:"أَصْبَحْنَا وَأَصْبَحَ المُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ", count:1},
        {text:"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ", count:1},
        {text:"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالإِسْلَامِ دِينًا، وَبُِمَحَمَّدٍ ﷺ نَبِيًّا", count:3}
      ]
    };

    const l1 = [
      {number:1, name:"الفاتحة", englishName:"Al-Fatiha", numberOfAyahs:7},
      {number:2, name:"البقرة", englishName:"Al-Baqara", numberOfAyahs:286},
      {number:36, name:"يس", englishName:"Ya-Sin", numberOfAyahs:83},
      {number:67, name:"الملك", englishName:"Al-Mulk", numberOfAyahs:30},
      {number:112, name:"الإخلاص", englishName:"Al-Ikhlas", numberOfAyahs:4}
    ];

    // التواشيح مع روابط بديلة ومباشرة تعمل بكفاءة
    const xt = [
      {id:1, title:"مولاي إني ببابك", artist:"الشيخ النقشبندي", duration:"12:34", url:"https://ia800900.us.archive.org/15/items/MolayInyEbAbak/Molay.mp3"},
      {id:2, title:"أسماء الله الحسنى", artist:"الشيخ النقشبندي", duration:"09:12", url:"https://ia802704.us.archive.org/29/items/AlAsmaaAlHosna_804/Assmaa.mp3"},
      {id:3, title:"قمر سيدنا النبي", artist:"الشيخ طه الفشني", duration:"06:45", url:"https://ia801400.us.archive.org/11/items/TahaAlFashni/Qamar.mp3"}
    ];

    const la = [
      {id:"ar.alafasy", name:"مشاري راشد العفاسي"},
      {id:"ar.abdulbasitmurattal", name:"عبد الباسط عبد الصمد"},
      {id:"ar.minshawi", name:"محمد صديق المنشاوي"}
    ];

    function App() {
      const [currentSurahIndex, setCurrentSurahIndex] = useState(0);
      const [reciter, setReciter] = useState(la[0].id);
      const [isPlayingQuran, setIsPlayingQuran] = useState(false);
      const [quranProgress, setQuranProgress] = useState(0);
      const [quranDuration, setQuranDuration] = useState(0);

      // التواشيح
      const [nasheedIndex, setNasheedIndex] = useState(0);
      const [isPlayingNasheed, setIsPlayingNasheed] = useState(false);
      const [nasheedProgress, setNasheedProgress] = useState(0);
      const [nasheedDuration, setNasheedDuration] = useState(0);

      // المسبحة
      const [tasbeehCount, setTasbeehCount] = useState(0);
      const [totalTasbeeh, setTotalTasbeeh] = useState(0);
      const [dhikrText, setDhikrText] = useState("سبحان الله");

      const quranAudioRef = useRef(null);
      const nasheedAudioRef = useRef(null);

      // تشغيل القرآن
      const handlePlayQuranToggle = () => {
        if (!quranAudioRef.current) return;
        if (isPlayingQuran) {
          quranAudioRef.current.pause();
          setIsPlayingQuran(false);
        } else {
          quranAudioRef.current.play().then(() => {
            setIsPlayingQuran(true);
          }).catch(err => {
            console.error("Quran play error:", err);
            alert("عذراً، تعذر تشغيل السورة حالياً. جرب قارئاً آخر.");
          });
        }
      };

      const changeSurah = (index) => {
        setCurrentSurahIndex(index);
        setIsPlayingQuran(false);
        setTimeout(() => {
          if (quranAudioRef.current) {
            quranAudioRef.current.load();
            quranAudioRef.current.play().then(() => setIsPlayingQuran(true)).catch(e => console.log(e));
          }
        }, 100);
      };

      // تشغيل التواشيح
      const handlePlayNasheedToggle = () => {
        if (!nasheedAudioRef.current) return;
        if (isPlayingNasheed) {
          nasheedAudioRef.current.pause();
          setIsPlayingNasheed(false);
        } else {
          nasheedAudioRef.current.play().then(() => {
            setIsPlayingNasheed(true);
          }).catch(err => {
            console.error("Nasheed play error:", err);
            alert("تعذر تشغيل الابتهال، تأكد من الاتصال بالإنترنت.");
          });
        }
      };

      const selectNasheed = (index) => {
        setNasheedIndex(index);
        setIsPlayingNasheed(false);
        setTimeout(() => {
          if (nasheedAudioRef.current) {
            nasheedAudioRef.current.load();
            nasheedAudioRef.current.play().then(() => setIsPlayingNasheed(true)).catch(e => console.log(e));
          }
        }, 100);
      };

      const currentSurah = l1[currentSurahIndex] || l1[0];

      return (
        <div className="max-w-4xl mx-auto p-4 sm:p-6 space-y-8">
          {/* رأس الصفحة */}
          <div className="glass-card-gold rounded-3xl p-6 text-center space-y-3">
            <h1 className="text-2xl sm:text-3xl font-bold font-quran text-[#f3e5ab]">
              صدقة جارية على روح المرحوم <span className="text-[#d4af37]">محمد ماهر</span>
            </h1>
            <p className="text-xs sm:text-sm text-emerald-200">نسأل الله أن يجعل هذا الموقع صدقة جارية ونوراً في قبره</p>
          </div>

          {/* قسم القرآن الكريم */}
          <div className="glass-card rounded-2xl p-6 space-y-4">
            <h3 className="text-xl font-bold text-[#f3e5ab] flex items-center gap-2">📖 القرآن الكريم</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="block text-xs mb-1 text-emerald-300">اختر القارئ:</label>
                <select 
                  value={reciter} 
                  onChange={(e) => setReciter(e.target.value)}
                  className="w-full bg-[#051610] border border-[#d4af37]/30 rounded-xl p-2.5 text-sm text-[#f3e5ab]"
                >
                  {la.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-xs mb-1 text-emerald-300">اختر السورة:</label>
                <select 
                  value={currentSurahIndex} 
                  onChange={(e) => changeSurah(Number(e.target.value))}
                  className="w-full bg-[#051610] border border-[#d4af37]/30 rounded-xl p-2.5 text-sm text-[#f3e5ab]"
                >
                  {l1.map((s, idx) => <option key={s.number} value={idx}>{s.number}. {s.name}</option>)}
                </select>
              </div>
            </div>

            <div className="text-center py-4 space-y-3 bg-[#051610]/50 rounded-xl border border-[#d4af37]/20">
              <h4 className="text-xl font-bold font-quran text-[#d4af37]">سورة {currentSurah.name}</h4>
              <audio 
                ref={quranAudioRef}
                src={`https://cdn.islamic.network/quran/audio-surah/128/${reciter}/${currentSurah.number}.mp3`}
                onTimeUpdate={() => setQuranProgress(quranAudioRef.current?.currentTime || 0)}
                onLoadedMetadata={() => setQuranDuration(quranAudioRef.current?.duration || 0)}
                onEnded={() => setIsPlayingQuran(false)}
                onError={() => alert("حدث خطأ أثناء تحميل الملف الصوتي للسورة.")}
              />
              <div className="flex justify-center items-center gap-4">
                <button 
                  onClick={handlePlayQuranToggle}
                  className="bg-[#d4af37] text-[#051610] font-bold px-6 py-2.5 rounded-full shadow-lg hover:bg-[#f3e5ab] transition-all"
                >
                  {isPlayingQuran ? "⏸ إيقاف مؤقت" : "▶ تشغيل التلاوة"}
                </button>
              </div>
            </div>
          </div>

          {/* قسم التواشيح والابتهالات */}
          <div className="glass-card rounded-2xl p-6 space-y-4">
            <h3 className="text-xl font-bold text-[#f3e5ab] flex items-center gap-2">✨ الابتهالات والتواشيح</h3>
            <div className="space-y-2">
              {xt.map((item, idx) => (
                <div key={item.id} className={`p-3 rounded-xl flex items-center justify-between border ${nasheedIndex === idx ? 'bg-[#d4af37]/20 border-[#d4af37]' : 'bg-[#051610]/40 border-[#d4af37]/10'}`}>
                  <div>
                    <p className="font-bold text-sm text-[#f3e5ab]">{item.title}</p>
                    <p className="text-xs text-emerald-300">{item.artist}</p>
                  </div>
                  <button 
                    onClick={() => selectNasheed(idx)}
                    className="bg-[#d4af37] text-[#051610] px-4 py-1.5 rounded-lg text-xs font-bold"
                  >
                    {nasheedIndex === idx && isPlayingNasheed ? "إيقاف" : "استماع"}
                  </button>
                </div>
              ))}
            </div>

            <div className="text-center pt-2">
              <audio 
                ref={nasheedAudioRef}
                src={xt[nasheedIndex].url}
                onTimeUpdate={() => setNasheedProgress(nasheedAudioRef.current?.currentTime || 0)}
                onLoadedMetadata={() => setNasheedDuration(nasheedAudioRef.current?.duration || 0)}
                onEnded={() => setIsPlayingNasheed(false)}
                onError={() => alert("تعذر تشغيل هذا الابتهال، جرب ابتهالاً آخر.")}
              />
              <button 
                onClick={handlePlayNasheedToggle}
                className="bg-emerald-800 text-white font-bold px-6 py-2 rounded-xl text-sm"
              >
                {isPlayingNasheed ? "إيقاف الابتهال الحالي ⏸" : "تشغيل / إيقاف الابتهال المختار 🔊"}
              </button>
            </div>
          </div>

          {/* المسبحة الإلكترونية */}
          <div className="glass-card rounded-2xl p-6 text-center space-y-4">
            <h3 className="text-xl font-bold text-[#f3e5ab]">📿 المسبحة الإلكترونية</h3>
            <p className="text-sm font-quran text-[#d4af37]">{dhikrText}</p>
            <div className="flex justify-center">
              <button 
                onClick={() => { setTasbeehCount(c => c + 1); setTotalSt => setTotalTasheeh(t => t + 1); }}
                className="w-36 h-36 rounded-full bg-gradient-to-tr from-[#051610] to-[#0a261d] border-4 border-[#d4af37] flex flex-col items-center justify-center shadow-2xl active:scale-95 transition-all"
              >
                <span className="text-4xl font-extrabold text-[#d4af37]">{tasbeehCount}</span>
                <span className="text-[11px] text-emerald-300 mt-1">اضغط للتسبيح</span>
              </button>
            </div>
            <button 
              onClick={() => setTasbeehCount(0)}
              className="text-xs text-emerald-400 underline hover:text-[#d4af37]"
            >
              تصفير العدّاد
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
